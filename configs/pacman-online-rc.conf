#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[omarchy]
Server = https://pkgs.omarchy.org/rc/$arch

[core]
Server = https://rc-mirror.omarchy.org/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[extra]
Server = https://rc-mirror.omarchy.org/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[multilib]
Server = https://rc-mirror.omarchy.org/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

# KaiT2en T2 Mac drivers for linux-omarchy (Omarchy fix-t2.sh). Signed with
# 077D8295CCF834D3F5EC25F70506B72C34EB162F, trusted in build-iso.sh.
[t2-arch-packages]
Server = https://github.com/josemiguelo/t2-arch-packages/releases/download/repo

[arch-mact2]
Server = https://github.com/NoaHimesaka1873/arch-mact2-mirror/releases/download/release
Server = https://mirror.funami.tech/arch-mact2/os/x86_64
SigLevel = Never
